<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Govardhan Puja, Coco</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,500;1,400&family=Dancing+Script:wght@500&family=Hanken+Grotesk:wght@400;500&family=Tiro+Devanagari+Hindi:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--cream:#f4ead9;--gold:#e8b04a;--clay:#7a3b14;--mute:#a79c8c;color-scheme:dark}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{min-height:100%;background:var(--bg);overflow-x:hidden}
body.lock{overflow:hidden;height:100vh}
body{color:var(--cream);font-family:'Hanken Grotesk',system-ui,sans-serif;touch-action:manipulation;-webkit-user-select:none;user-select:none}
section.sec{position:relative;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.4vh;padding:56px 24px 56px}
.fig{position:relative;display:inline-block;line-height:0}
.fig img{display:block;max-width:100%;height:auto}
/* diya intro */
.col{position:relative}
.col::before{content:"";position:absolute;left:50%;top:calc(16% + 14px);bottom:calc(14% + 60px);width:1px;background:linear-gradient(rgba(232,176,74,.0),rgba(232,176,74,.22),rgba(232,176,74,0))}
.bulb{position:absolute;left:50%;top:16%;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:#2c2536;transition:background .5s,box-shadow .5s}
.bulb.lit{background:radial-gradient(#fff7d6,var(--gold));box-shadow:0 0 22px 7px rgba(232,176,74,.55)}
.bulb.lit::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:1.5px solid var(--gold);animation:rip 1.1s ease-out forwards}
@keyframes rip{from{transform:scale(.6);opacity:1}to{transform:scale(3.2);opacity:0}}
.diya{position:absolute;left:50%;bottom:14%;width:68px;height:80px;margin-left:-34px;border:0;background:none;cursor:pointer;padding:0}
.diya .bowl{position:absolute;left:6px;right:6px;bottom:0;height:30px;border-radius:2px 2px 30px 30px/2px 2px 30px 30px;background:linear-gradient(#b8651f,var(--clay));box-shadow:inset 0 3px 0 rgba(255,214,150,.25)}
.diya .oil{position:absolute;left:11px;right:11px;bottom:23px;height:8px;border-radius:50%;background:#2a1408}
.diya .flame{position:absolute;left:50%;bottom:28px;width:14px;height:32px;margin-left:-7px;border-radius:50% 50% 50% 50%/62% 62% 38% 38%;background:radial-gradient(ellipse at 50% 75%,#fffbe8 8%,#ffd877 38%,#f08a24 78%,transparent);transform:scale(0);transform-origin:50% 100%;filter:drop-shadow(0 0 12px rgba(255,170,60,.9))}
.diya.lit .flame{transform:scale(1);animation:fl 1.3s ease-in-out .45s infinite alternate;transition:transform .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes fl{to{transform:scale(1.08,.9) rotate(2.5deg)}}
.diya:not(.lit)::after{content:"";position:absolute;left:50%;bottom:20px;width:46px;height:46px;margin-left:-23px;border-radius:50%;background:radial-gradient(rgba(232,176,74,.28),transparent 70%);animation:br 2.4s ease-in-out infinite}
@keyframes br{50%{transform:scale(1.35);opacity:.4}}
.diya:focus-visible{outline:2px solid var(--cream);outline-offset:4px}
.ember{position:absolute;width:10px;height:10px;margin:-5px;border-radius:50%;background:#fff3c4;box-shadow:0 0 14px 6px rgba(255,190,80,.9);pointer-events:none;z-index:4}
/* typography */
h1{font-family:'Cormorant Garamond','Times New Roman',serif;font-weight:300;font-size:clamp(2.1rem,9.4vw,3.3rem);line-height:1.05;text-align:center;letter-spacing:.005em;text-wrap:balance}
.wish{font-family:'Cormorant Garamond',serif;font-size:clamp(1.08rem,4.6vw,1.3rem);line-height:1.5;text-align:center;max-width:30ch;color:#eadfca}
.sign{font-size:.9rem;color:var(--mute);letter-spacing:.04em}
#s1 .fig img{max-height:40vh;width:auto;border-radius:6px}
#s2 .fig img{max-height:42vh;width:auto;border-radius:6px}
.shayari{font-family:'Tiro Devanagari Hindi','Hind',serif;font-style:italic;font-size:clamp(1rem,4.3vw,1.18rem);line-height:1.9;text-align:center;max-width:36ch;color:#efe2c9;text-wrap:balance}
.shayari span{display:block}.shayari .g{margin-top:.8em}
#s3{background:radial-gradient(60% 45% at 50% 52%,rgba(232,176,74,.2),transparent 70%)}
#s3 .fig img{max-height:68vh;width:auto;filter:drop-shadow(0 0 28px rgba(232,176,74,.28))}
.toon img{width:auto}
#s4 .toon img{max-height:66vh;max-width:92vw}
#s5 .toon img{max-width:94vw;max-height:60vh}
#s6 .toon img{max-height:68vh;max-width:92vw}

#s7 .fig img{max-height:76vh;width:auto;border-radius:6px}
#lyr{position:absolute;left:0;right:0;bottom:0;padding:70px 14px 26px;text-align:center;background:linear-gradient(transparent,rgba(6,5,12,.85));border-radius:0 0 6px 6px;pointer-events:none;line-height:1.25}
#lyr .ln{display:block;font-family:'Dancing Script','Segoe Script',cursive;font-weight:500;color:#fff;font-size:clamp(1.45rem,6.4vw,1.95rem);text-shadow:0 2px 14px rgba(0,0,0,.75);width:fit-content;margin:0 auto;clip-path:inset(-30% 100% -30% 0);animation:wr var(--d,2.4s) cubic-bezier(.4,.1,.3,1) forwards}
@keyframes wr{to{clip-path:inset(-30% 0 -30% 0)}}
#end{position:absolute;left:0;right:0;bottom:calc(26px + env(safe-area-inset-bottom,0px));text-align:center;opacity:0;transition:opacity 1.4s}
#end.show{opacity:1}
#end b{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:1.3rem;display:block}
/* bubbles */
.spot{position:absolute;width:26%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;border:0;background:none;padding:0;cursor:pointer}
.spot::before,.spot::after{content:"";position:absolute;left:50%;top:50%;width:46%;aspect-ratio:1;margin:-23% 0 0 -23%;border-radius:50%;border:1.5px solid var(--gold);animation:pr 2.1s ease-out infinite}
.spot::after{animation-delay:1.05s}
@keyframes pr{from{transform:scale(.7);opacity:.9}to{transform:scale(2.1);opacity:0}}
.spot.open::before,.spot.open::after{display:none}.spot.open{pointer-events:none}
.bub{position:absolute;left:0;top:0;transform:translate(-50%,-60%) scale(.5);opacity:0;background:var(--cream);color:#21170c;font:500 .98rem 'Hanken Grotesk',sans-serif;line-height:1.2;border-radius:14px;padding:9px 15px;white-space:nowrap;pointer-events:none;transition:transform .5s cubic-bezier(.3,1.5,.5,1),opacity .3s}
.bub::after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-bottom:0;border-top-color:var(--cream)}
.bub.show{opacity:1;transform:translate(-50%,-150%) scale(1)}
/* face taps */
.face{position:absolute;cursor:pointer}
.splat{position:absolute;pointer-events:none;transform:translate(-50%,-50%);text-align:center;white-space:nowrap;animation:sp 1.9s ease-out forwards;line-height:1.2;z-index:6}
.splat i{display:block;font-style:normal;font-size:2.7rem}
.splat b{display:block;margin-top:4px;font:500 .95rem 'Hanken Grotesk',sans-serif;color:#21170c;background:var(--cream);border-radius:99px;padding:3px 14px}
@keyframes sp{0%{transform:translate(-50%,-260%) scale(.5);opacity:0}22%{transform:translate(-50%,-50%) scale(1.25);opacity:1}38%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{transform:translate(-50%,-20%);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important;transition-duration:.01s!important}}

.cap{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(1.12rem,4.8vw,1.35rem);line-height:1.45;text-align:center;max-width:28ch;color:#eadfca;text-wrap:balance}
#intro{position:fixed;inset:0;z-index:100;background:radial-gradient(70% 45% at 50% 70%,#3a1d0a 0%,#000 72%);transition:opacity 1.2s ease,visibility 0s 1.2s}
#intro.gone{opacity:0;visibility:hidden;pointer-events:none}
.cols{position:relative;display:grid;width:100%;max-width:520px}
.cols.five{grid-template-columns:repeat(5,1fr);height:46vh;min-height:300px}
#intro .cols{position:absolute;inset:0;max-width:none;display:block}
.col{position:relative;height:100%}
.col::before{content:"";position:absolute;left:50%;top:calc(10% + 14px);bottom:calc(8% + 60px);width:1px;background:linear-gradient(rgba(232,176,74,0),rgba(232,176,74,.22),rgba(232,176,74,0))}
.bulb{position:absolute;left:50%;top:10%;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:#2c2536;transition:background .5s,box-shadow .5s}
.bulb.lit{background:radial-gradient(#fff7d6,var(--gold));box-shadow:0 0 22px 7px rgba(232,176,74,.55)}
.bulb.lit::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:1.5px solid var(--gold);animation:rip 1.1s ease-out forwards}
.diya{position:absolute;left:50%;bottom:8%;width:68px;height:80px;margin-left:-34px;border:0;background:none;cursor:pointer;padding:0}
#intro .col{position:absolute;left:50%;width:140px;margin-left:-70px;top:0;bottom:0}
#intro .bulb{top:18%}
#intro .col::before{top:calc(18% + 14px);bottom:calc(26% + 70px)}
#intro .diya{bottom:26%;transform:scale(1.35);transform-origin:50% 100%}
#final{padding-bottom:90px}
#final .glow{position:absolute;inset:0;background:radial-gradient(70% 50% at 50% 55%,rgba(240,138,36,.28),transparent 72%);opacity:0;transition:opacity 1.6s;pointer-events:none}
#final.all .glow{opacity:1}
#end{text-align:center;opacity:0;transform:translateY(8px);transition:opacity 1.6s .6s,transform 1.6s .6s}
#final.all #end{opacity:1;transform:none}
#end b{font-family:'Cormorant Garamond',serif;font-weight:300;font-size:clamp(1.9rem,8vw,2.7rem);display:block;line-height:1.1}
</style>
</head>
<body class="lock">
<div id="intro">
  <div class="cols"><div class="col"><span class="bulb"></span><button class="diya" aria-label="Light the diya"><span class="bowl"></span><span class="oil"></span><span class="flame"></span></button></div></div>
</div>
